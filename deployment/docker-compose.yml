services:
  langchain-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langchain-platform
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-langchain-platform}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - PORT=8000
      # Security settings for external exposure (ngrok)
      - API_KEY_ENABLED=${API_KEY_ENABLED:-false}
      - API_KEY=${API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # ServiceNow settings for Deep Agent
      - SERVICENOW_INSTANCE=${SERVICENOW_INSTANCE:-}
      - SERVICENOW_USERNAME=${SERVICENOW_USERNAME:-}
      - SERVICENOW_PASSWORD=${SERVICENOW_PASSWORD:-}
      - SERVICENOW_MODE=${SERVICENOW_MODE:-simulation}
      # Deep Agent settings
      - DEEP_AGENT_STORAGE_PATH=/app/data/deepagent_context
    env_file:
      - .env
    volumes:
      # Persistent storage for Deep Agent context
      - deepagent_data:/app/data/deepagent_context
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

  # Optional: Redis for caching (uncomment if needed)
  # redis:
  #   image: redis:7-alpine
  #   container_name: langchain-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   restart: unless-stopped

  # Optional: Vector database (uncomment if needed)
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: langchain-qdrant
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   restart: unless-stopped

volumes:
  deepagent_data:
    driver: local
#   redis_data:
#   qdrant_data:

networks:
  default:
    name: langchain-network
