services:
  langchain-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langchain-platform
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-langchain-platform}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - PORT=8000
      # Security settings for external exposure (ngrok)
      - API_KEY_ENABLED=${API_KEY_ENABLED:-false}
      - API_KEY=${API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # ServiceNow settings for Deep Agent
      - SERVICENOW_INSTANCE=${SERVICENOW_INSTANCE:-}
      - SERVICENOW_USERNAME=${SERVICENOW_USERNAME:-}
      - SERVICENOW_PASSWORD=${SERVICENOW_PASSWORD:-}
      - SERVICENOW_MODE=${SERVICENOW_MODE:-simulation}
      # Deep Agent settings
      - DEEP_AGENT_STORAGE_PATH=/app/data/deepagent_context
      # Redis (set SESSION_STORE=redis to activate)
      - SESSION_STORE=${SESSION_STORE:-memory}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # PostgreSQL (set CHECKPOINT_STORE=postgres to activate)
      - DATABASE_URL=${DATABASE_URL:-postgresql://langchain:${POSTGRES_PASSWORD:-changeme}@postgres:5432/langchain_agents}
      # History & caching
      - MAX_HISTORY_MESSAGES=${MAX_HISTORY_MESSAGES:-0}
      - CACHE_ENABLED=${CACHE_ENABLED:-false}
    env_file:
      - .env
    volumes:
      - deepagent_data:/app/data/deepagent_context
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: langchain-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: langchain-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=langchain_agents
      - POSTGRES_USER=langchain
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langchain -d langchain_agents"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  deepagent_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  default:
    name: langchain-network
